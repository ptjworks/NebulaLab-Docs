name: Docs Compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: node --test test/legacy-redirect.test.mjs
      - run: npm ci
      - run: npm run docs:build
      - run: node scripts/build-legacy-user-pages.mjs out/legacy-user-pages
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-user-pages
          path: out/legacy-user-pages
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist
